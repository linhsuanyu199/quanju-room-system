name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'  # 每 3 天跑一次，避免 Supabase 免費專案 7 天無流量自動暫停
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          # 必須打真實資料表，anon key 打 /rest/v1/ 根路徑會被擋（只收 service_role）
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://cvryjcdcrebdnlemgabs.supabase.co/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          test "$code" = "200"
