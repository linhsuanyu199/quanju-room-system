<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預約詢問 — 短租公寓</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/cloud-config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a3a6b;--accent:#2563eb;--success:#16a34a;
  --bg:#f8fafd;--card:#fff;--border:#e2e8f0;
  --text:#1e293b;--muted:#64748b;--light:#f1f5f9;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --radius:12px;--radius-sm:8px;--radius-pill:999px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}

header{background:rgba(26,58,107,.97);border-bottom:1px solid rgba(255,255,255,.1)}
.nav-inner{max-width:760px;margin:0 auto;padding:0 20px;display:flex;align-items:center;
  justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.logo-name{font-size:18px;font-weight:700;letter-spacing:.5px}
.logo-sub{font-size:10px;opacity:.7;letter-spacing:1px;text-transform:uppercase}
.back-link{color:rgba(255,255,255,.85);text-decoration:none;font-size:14px;
  padding:8px 16px;border-radius:var(--radius-pill)}
.back-link:hover{color:#fff;background:rgba(255,255,255,.15)}

.wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px}
.page-title{font-size:24px;font-weight:800;color:var(--primary);margin-bottom:6px}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:24px}

.target{background:linear-gradient(135deg,#0f2550,#1d4ed8);color:#fff;
  border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.target-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.target-name{font-size:19px;font-weight:700;margin-top:2px}
.target-meta{font-size:13px;opacity:.85;margin-top:6px}
.target-room{display:inline-block;background:rgba(255,255,255,.18);border-radius:var(--radius-pill);
  padding:3px 12px;font-size:13px;font-weight:600;margin-top:8px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px}
.form-group{margin-bottom:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.req{color:#dc2626;margin-left:3px}
.hint{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);
  background:#fff;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:96px;resize:vertical}
.optin{display:flex;gap:10px;align-items:flex-start;background:var(--light);
  border-radius:var(--radius-sm);padding:14px;margin-bottom:20px}
.optin input{accent-color:var(--accent);width:17px;height:17px;margin-top:2px;flex:none}
.optin-text{font-size:13px;color:var(--muted);line-height:1.5}
.optin-text b{color:var(--text);font-weight:600;display:block;margin-bottom:2px}
.btn-submit{width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:14px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:background .2s}
.btn-submit:hover:not(:disabled){background:#1d4ed8}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;
  border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}

.done{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:48px 24px;text-align:center;display:none}
.done .icon{font-size:52px;margin-bottom:12px}
.done h2{font-size:22px;color:var(--primary);margin-bottom:8px}
.done p{color:var(--muted);font-size:14px;margin-bottom:20px}
.done a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
  padding:11px 26px;border-radius:var(--radius-sm);font-weight:600;font-size:14px}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:560px){.form-row{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="#" class="logo" id="homeLink">
      <div class="logo-icon">住</div>
      <div>
        <div class="logo-name">短租公寓</div>
        <div class="logo-sub">Short-term Rental</div>
      </div>
    </a>
    <a href="#" class="back-link" id="backLink">← 回房源列表</a>
  </div>
</header>

<div class="wrap">
  <div id="loading" class="loading">房源資料載入中…</div>

  <div id="formArea" style="display:none">
    <div class="page-title">預約詢問</div>
    <div class="page-sub">填寫以下資料，我們會盡快與您聯繫安排看房。</div>

    <div class="target" id="target" style="display:none">
      <div class="target-label">詢問物件</div>
      <div class="target-name" id="tgName"></div>
      <div class="target-meta" id="tgAddr"></div>
      <div class="target-room" id="tgRoom" style="display:none"></div>
    </div>

    <div class="card">
      <div class="err" id="errBox"></div>

      <div class="form-group" id="propPick" style="display:none">
        <label>想詢問的物件<span class="hint">選填，也可以直接留下需求由我們推薦</span></label>
        <select id="fPropSel"><option value="">尚未決定／請幫我推薦</option></select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>姓名<span class="req">*</span></label>
          <input type="text" id="fName" maxlength="40" placeholder="請輸入姓名">
        </div>
        <div class="form-group">
          <label>聯絡電話<span class="req">*</span></label>
          <input type="tel" id="fPhone" maxlength="20" placeholder="0912-345-678">
        </div>
      </div>

      <div class="form-group">
        <label>Email<span class="hint">選填，用於寄送房源資訊</span></label>
        <input type="email" id="fEmail" maxlength="80" placeholder="you@example.com">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>希望入住日</label>
          <input type="date" id="fDate">
        </div>
        <div class="form-group">
          <label>預計承租期間</label>
          <select id="fLease">
            <option value="">尚未決定</option>
            <option value="1">1 個月</option>
            <option value="3">3 個月</option>
            <option value="6">6 個月</option>
            <option value="12">1 年</option>
            <option value="24">2 年以上</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>需求備註<span class="hint">選填，最多 500 字</span></label>
        <textarea id="fNote" maxlength="500" placeholder="例如：需要可開伙、想看有對外窗的房間、方便看房的時段…"></textarea>
      </div>

      <div class="optin">
        <input type="checkbox" id="fOptIn">
        <label for="fOptIn" class="optin-text" style="margin:0;cursor:pointer">
          <b>同意接收活動與祝福訊息</b>
          我同意提供上述個人資料供房源媒合與聯繫使用，並願意收到生日祝福、節慶問候及優惠活動通知。您可隨時來信要求停止接收或刪除資料。
        </label>
      </div>

      <button class="btn-submit" id="btnSubmit">送出詢問</button>
      <div class="note">送出後我們將於營業時間內主動與您聯繫</div>
    </div>
  </div>

  <div class="done" id="doneArea">
    <div class="icon">✅</div>
    <h2>詢問已送出</h2>
    <p>我們已收到您的需求，將盡快與您聯繫，謝謝您的興趣。</p>
    <a href="#" id="doneBack">回房源列表</a>
  </div>
</div>

<script>
'use strict';

const params = new URLSearchParams(location.search);
const companyId = params.get('co');
const qProp = params.get('prop') || '';
const qRoom = params.get('room') || '';

let sb = null, props = [];

const $ = id => document.getElementById(id);

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function backUrl(){ return 'public.html?co=' + encodeURIComponent(companyId||''); }

function fail(msg){
  $('loading').innerHTML = esc(msg);
}

function showErr(msg){
  const box = $('errBox');
  box.textContent = msg;
  box.style.display = 'block';
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

function normalizeType(t){
  const M = {'分套':'分租套房','分雅':'分租雅房','獨套':'獨立套房'};
  return M[t] || t || '';
}

// 從 public_company_listings 的原始資料整理出「可見物件 → 房間」清單
function buildProps(d){
  const cps = d.cps||[], ovr = d.ovr||{}, ext = d.ext||{}, info = d.propinfo||{}, vis = d.vis||{};
  return cps.map(p=>{
    const pid = String(p.id);
    if(vis[pid] === false) return null;
    const rooms = [...(p.rooms||[]), ...(ext[pid]||[])].map(r=>({
      room: r.room,
      type: normalizeType(r.type),
      price: (ovr[pid] && ovr[pid][r.room] !== undefined) ? ovr[pid][r.room] : r.price
    }));
    const extra = info[pid] || {};
    return { id: pid, name: p.name, address: extra.address || p.address || '', rooms };
  }).filter(Boolean);
}

async function boot(){
  $('homeLink').href = backUrl();
  $('backLink').href = backUrl();
  $('doneBack').href = backUrl();

  if(!companyId){
    fail('此連結缺少企業識別碼，請向物業管理方索取正確的詢問連結。');
    return;
  }
  try{
    sb = window.supabase.createClient(window.CLOUD_URL, window.CLOUD_KEY);
    const { data, error } = await sb.rpc('public_company_listings', { p_company_id: companyId });
    if(error || !data){
      fail('找不到此企業的房源資料，請確認連結是否正確。');
      return;
    }
    props = buildProps(data);
  }catch(e){
    fail('房源資料載入失敗，請稍後再試。');
    return;
  }

  const target = qProp ? props.find(p => p.id === String(qProp)) : null;

  if(target){
    $('tgName').textContent = target.name;
    $('tgAddr').textContent = target.address ? '📍 ' + target.address : '';
    if(qRoom){
      const r = target.rooms.find(x => String(x.room) === String(qRoom));
      $('tgRoom').textContent = r
        ? `${r.room} 房 · ${r.type} · NT$${(r.price||0).toLocaleString()}／月`
        : `${qRoom} 房`;
      $('tgRoom').style.display = 'inline-block';
    }
    $('target').style.display = 'block';
  }else{
    // 未指定房源：提供下拉讓訪客自行選（可留空）
    const sel = $('fPropSel');
    props.forEach(p=>{
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.name + (p.address ? '（' + p.address + '）' : '');
      sel.appendChild(o);
    });
    $('propPick').style.display = 'block';
  }

  $('loading').style.display = 'none';
  $('formArea').style.display = 'block';
  $('btnSubmit').addEventListener('click', submit);
}

function chosenProp(){
  if(qProp){
    const p = props.find(x => x.id === String(qProp));
    if(p) return { id: p.id, room: qRoom, label: p.name };
  }
  const v = $('fPropSel').value;
  if(v){
    const p = props.find(x => x.id === v);
    if(p) return { id: p.id, room: '', label: p.name };
  }
  return { id: '', room: '', label: '' };
}

async function submit(){
  const name  = $('fName').value.trim();
  const phone = $('fPhone').value.trim();
  const email = $('fEmail').value.trim();

  $('errBox').style.display = 'none';

  if(!name){ showErr('請輸入姓名'); $('fName').focus(); return; }
  if(!/^[0-9+\-() ]{6,20}$/.test(phone)){
    showErr('請輸入正確的聯絡電話（僅限數字與 + - ( ) 空白，6～20 字）');
    $('fPhone').focus(); return;
  }
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    showErr('Email 格式不正確'); $('fEmail').focus(); return;
  }

  const btn = $('btnSubmit');
  btn.disabled = true;
  btn.textContent = '送出中…';

  const tgt = chosenProp();
  const lease = $('fLease').value;

  let data, error;
  try{
    ({ data, error } = await sb.rpc('public_submit_inquiry_v2', {
      p_company_id:  companyId,
      p_name:        name,
      p_phone:       phone,
      p_email:       email || null,
      p_prop_id:     tgt.id || null,
      p_room:        tgt.room || null,
      p_prop_label:  tgt.label || null,
      p_move_in:     $('fDate').value || null,
      p_lease_months: lease ? Number(lease) : null,
      p_note:        $('fNote').value.trim() || null,
      p_opt_in:      $('fOptIn').checked
    }));
  }catch(e){ error = e; }

  if(error || data !== true){
    btn.disabled = false;
    btn.textContent = '送出詢問';
    showErr(data === false
      ? '送出失敗：資料格式有誤，或短時間內送出次數過多，請稍後再試。'
      : '送出失敗，請稍後再試。');
    return;
  }

  $('formArea').style.display = 'none';
  $('doneArea').style.display = 'block';
  window.scrollTo({top:0});
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
